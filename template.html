<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Manrope'; src: url('fonts/manrope.woff2') format('woff2'); font-weight: 200 800; }
  @font-face { font-family: 'Cormorant'; src: url('fonts/cormorant-italic.woff2') format('woff2'); font-style: italic; }
  @font-face { font-family: 'Plex'; src: url('fonts/plexmono.woff2') format('woff2'); }
  @font-face { font-family: 'Amiri'; src: url('fonts/amiri.woff2') format('woff2'); }

  :root { --bg: #F4EFE4; --panel: #EAE2D2; --ink: #1E2A24; --muted: #6B6A5E; --accent: #2F5D46; --gold: #B8924A; --grid: rgba(30,42,36,0.07); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
  body {
    font-family: 'Manrope', sans-serif; color: var(--ink);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 60px 60px;
  }
  .frame { position: absolute; inset: 70px; border: 2px solid var(--gold); border-radius: 28px; opacity: 0.55; }
  .corner { position: absolute; width: 90px; height: 90px; border: 3px solid var(--gold); transform: rotate(45deg); opacity: 0.35; }
  .c1 { left: 30px; top: 30px; } .c2 { right: 30px; top: 30px; } .c3 { left: 30px; bottom: 30px; } .c4 { right: 30px; bottom: 30px; }

  .top { position: absolute; top: 290px; left: 0; right: 0; text-align: center; }
  .label { font-family: 'Plex', monospace; font-size: 30px; letter-spacing: 7px; color: var(--accent); text-transform: uppercase; }
  .bar { width: 120px; height: 3px; background: var(--gold); margin: 22px auto 0; transform-origin: center; }
  .handle { position: absolute; bottom: 400px; left: 0; right: 0; text-align: center; font-family: 'Plex', monospace; font-size: 28px; letter-spacing: 4px; color: var(--muted); }

  .scene { position: absolute; left: 120px; right: 120px; top: 420px; bottom: 470px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; opacity: 0; }
  .hook { font-size: 84px; font-weight: 800; line-height: 1.15; letter-spacing: -1px; }
  em { font-family: 'Cormorant', serif; font-style: italic; font-weight: 500; color: var(--accent); font-size: 1.12em; letter-spacing: 0; }
  .arabic { font-family: 'Amiri', serif; direction: rtl; font-size: 64px; line-height: 1.7; color: var(--ink); margin-bottom: 18px; }
  .ref { font-family: 'Plex', monospace; font-size: 26px; letter-spacing: 5px; color: var(--gold); margin-bottom: 56px; }
  .line { font-size: 52px; font-weight: 600; line-height: 1.3; margin: 18px 0; }
  .num { font-family: 'Plex', monospace; font-size: 26px; color: var(--gold); display: block; letter-spacing: 4px; margin-bottom: 6px; }
  .card { border: 3px solid var(--accent); border-radius: 28px; padding: 64px 56px; background: var(--panel); width: 100%; }
  .card .label { margin-bottom: 30px; }
  .step { font-size: 60px; font-weight: 800; line-height: 1.2; }
  .check { width: 84px; height: 84px; margin: 44px auto 0; }
  .cta1 { font-family: 'Cormorant', serif; font-style: italic; font-size: 84px; color: var(--accent); }
  .cta2 { font-size: 66px; font-weight: 800; line-height: 1.2; margin-top: 24px; }
  .progress { position: absolute; bottom: 360px; left: 240px; right: 240px; height: 6px; background: var(--grid); border-radius: 3px; }
  .progress i { display: block; height: 100%; width: 0; background: var(--gold); border-radius: 3px; }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="corner c1"></div><div class="corner c2"></div><div class="corner c3"></div><div class="corner c4"></div>

  <div class="top"><div class="label" id="level"></div><div class="bar" id="bar"></div></div>

  <div class="scene" id="s-hook"><div class="hook a" id="hook"></div></div>

  <div class="scene" id="s-lesson">
    <div class="arabic a" id="arabic"></div>
    <div class="ref a" id="ref"></div>
    <div id="lines"></div>
  </div>

  <div class="scene" id="s-step">
    <div class="card a">
      <div class="label">Today's Level</div>
      <div class="step" id="step"></div>
      <svg class="check" viewBox="0 0 84 84"><rect x="4" y="4" width="76" height="76" rx="14" fill="none" stroke="var(--accent)" stroke-width="5"/><path id="tick" d="M22 44 L37 58 L63 28" fill="none" stroke="var(--gold)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="70" stroke-dashoffset="70"/></svg>
    </div>
  </div>

  <div class="scene" id="s-cta">
    <div class="cta1 a" id="cta1"></div>
    <div class="cta2 a" id="cta2"></div>
  </div>

  <div class="progress"><i id="prog"></i></div>
  <div class="handle">@JANNAH_LEVELING</div>

<script>
  const R = window.REEL;
  const T = R.theme;
  for (const k in T) document.documentElement.style.setProperty('--' + k, T[k]);

  const md = s => (s || '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])).replace(/\*(.+?)\*/g, '<em>$1</em>');
  document.getElementById('level').textContent = R.level_label;
  document.getElementById('hook').innerHTML = md(R.hook);
  document.getElementById('arabic').textContent = R.arabic || '';
  document.getElementById('ref').textContent = R.reference || '';
  document.getElementById('step').innerHTML = md(R.todays_step);
  const ctaParts = (R.cta || '').split(/(?<=[.!?])\s+/);
  document.getElementById('cta1').innerHTML = md(ctaParts.length > 1 ? ctaParts[0] : '');
  document.getElementById('cta2').innerHTML = md(ctaParts.length > 1 ? ctaParts.slice(1).join(' ') : ctaParts[0]);
  const linesEl = document.getElementById('lines');
  R.lessons.forEach((l, i) => {
    const d = document.createElement('div'); d.className = 'line a';
    d.innerHTML = '<span class="num">0' + (i + 1) + '</span>' + md(l); linesEl.appendChild(d);
  });

  const ease = x => 1 - Math.pow(1 - Math.min(Math.max(x, 0), 1), 3);
  const show = (el, t, delay, dur = 0.6) => {
    const p = ease((t - delay) / dur);
    el.style.opacity = p; el.style.transform = `translateY(${(1 - p) * 40}px)`;
  };

  // R.scenes: [{id, start, end}] ; R.lessonTimes: start time of each lesson line
  window.renderAt = t => {
    document.getElementById('prog').style.width = Math.min(100, t / R.total * 100) + '%';
    document.getElementById('bar').style.transform = `scaleX(${ease(t / 0.8)})`;
    show(document.getElementById('level'), t, 0.1);
    for (const s of R.scenes) {
      const el = document.getElementById('s-' + s.id);
      const fadeIn = ease((t - s.start) / 0.35), fadeOut = 1 - ease((t - (s.end - 0.3)) / 0.3);
      el.style.opacity = (t >= s.start && t < s.end + 0.01) ? Math.min(fadeIn, fadeOut) : 0;
      const local = t - s.start;
      if (s.id === 'hook') show(document.getElementById('hook'), local, 0.05, 0.7);
      if (s.id === 'lesson') {
        show(document.getElementById('arabic'), local, 0.05);
        show(document.getElementById('ref'), local, 0.35);
        linesEl.querySelectorAll('.line').forEach((el2, i) => show(el2, t, R.lessonTimes[i]));
      }
      if (s.id === 'step') {
        show(document.querySelector('#s-step .card'), local, 0.05);
        document.getElementById('tick').style.strokeDashoffset = 70 * (1 - ease((local - (s.end - s.start) * 0.55) / 0.5));
      }
      if (s.id === 'cta') { show(document.getElementById('cta1'), local, 0.05); show(document.getElementById('cta2'), local, 0.45); }
    }
  };
  window.renderAt(0);
</script>
</body>
</html>
