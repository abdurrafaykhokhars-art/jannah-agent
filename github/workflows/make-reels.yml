name: Make Reels
on:
  schedule:
    - cron: '0 16 * * *'        # every day 9:00 PM Pakistan time
  workflow_dispatch:            # "Run workflow" button for testing
permissions:
  contents: write
concurrency:
  group: agent-state
  cancel-in-progress: false
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Cache voice model
        id: models
        uses: actions/cache@v4
        with:
          path: renderer/models
          key: kokoro-v1.0-int8
      - name: Download free voice model
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          mkdir -p renderer/models
          curl -fsSL -o renderer/models/kokoro-v1.0.int8.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx
          curl -fsSL -o renderer/models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - name: Install tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Make reels
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m agent.make_reels
      - name: Upload videos
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/push_videos.sh
      - name: Save memory
        if: always()
        run: bash scripts/save_state.sh "made reels"
